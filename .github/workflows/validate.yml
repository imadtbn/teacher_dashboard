name: Validate teacher dashboard
on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Run grade engine regression tests
        run: node --test tests/*.test.cjs
